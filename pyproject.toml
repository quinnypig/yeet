[project]
name = "yeet"
version = "0.1.0"
description = "yeet deploys your application using AI inference"
readme = "README.md"
authors = [
    { name = "Corey Quinn", email = "corey@sequestered.net" }
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "anthropic>=0.39.0",
    "requests>=2.32.0",
    "rich>=13.0.0",
]

[project.scripts]
yeet = "yeet.main:yeet_cli"
yoten = "yeet.main:yoten_cli"

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"
